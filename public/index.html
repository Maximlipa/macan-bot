<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чёрный список — Клан МАКАН</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        h2 {
            color: #ef4444;
            text-align: center;
        }
        .admin-box, .search-box {
            max-width: 800px;
            margin: 0 auto 20px auto;
            background: #1e1e1e;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #333;
        }
        input, button {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            margin-bottom: 8px;
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background: #ef4444;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background: #dc2626;
        }
        .btn-buyout {
            background: #10b981;
            width: auto;
            padding: 5px 10px;
            margin-right: 5px;
        }
        .btn-buyout:hover {
            background: #059669;
        }
        .btn-remove {
            background: #ef4444;
            width: auto;
            padding: 5px 10px;
        }
        table {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            border-collapse: collapse;
            background: #1e1e1e;
            border-radius: 8px;
            overflow: hidden;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #333;
        }
        th {
            background: #252525;
            color: #ff5252;
        }
    </style>
</head>
<body>

    <h2>Чёрный список — Клан МАКАН</h2>

    <!-- Форма входа в админку -->
    <div class="admin-box" id="loginBox">
        <input type="password" id="adminPass" placeholder="Введите пароль администратора...">
        <button onclick="checkAdmin()">Войти в админку</button>
    </div>

    <!-- Сама админ-панель (скрыта по умолчанию) -->
    <div class="admin-box" id="adminPanel" style="display: none;">
        <h3>⚙️ Админ-панель: Добавить в ЧС</h3>
        <input type="text" id="addSteam" placeholder="Steam2 ID (STEAM_0:1:...)">
        <input type="text" id="addReason" placeholder="Причина внесения">
        <input type="number" id="addBuyout" placeholder="Откуп ($)">
        <button onclick="addPlayer()">Добавить игрока</button>
        <button onclick="logoutAdmin()" style="background: #444;">Выйти из админки</button>
    </div>

    <!-- Поиск -->
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Поиск по Steam2 ID или причине..." oninput="filterTable()">
    </div>

    <!-- Таблица -->
    <table>
        <thead>
            <tr>
                <th>Steam2 ID</th>
                <th>Причина</th>
                <th>Откуп</th>
                <th id="thActions" style="display: none;">Действия</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <!-- Данные подгружаются скриптом -->
        </tbody>
    </table>

    <script>
        var isAdmin = false;

        function checkAdmin() {
            var pass = document.getElementById('adminPass').value;
            if (pass === 'makan2026') { // Пароль администратора
                isAdmin = true;
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
                document.getElementById('thActions').style.display = 'table-cell';
                loadBlacklist();
                alert('Успешный вход в админку!');
            } else {
                alert('Неверный пароль!');
            }
        }

        function logoutAdmin() {
            isAdmin = false;
            document.getElementById('loginBox').style.display = 'block';
            document.getElementById('adminPanel').style.display = 'none';
            document.getElementById('thActions').style.display = 'none';
            document.getElementById('adminPass').value = '';
            loadBlacklist();
        }

        function loadBlacklist() {
            fetch('/api/blacklist')
                .then(function(res) { return res.json(); })
                .then(function(data) {
                    var tbody = document.getElementById('tableBody');
                    tbody.innerHTML = '';

                    data.forEach(function(item, index) {
                        var tr = document.createElement('tr');
                        
                        var actionButtons = '';
                        if (isAdmin) {
                            actionButtons = '<td>' +
                                '<button class="btn-buyout" onclick="makeBuyout(' + index + ')">Выкуплен</button> ' +
                                '<button class="btn-remove" onclick="removePlayer(' + index + ')">Удалить</button>' +
                                '</td>';
                        } else {
                            actionButtons = '<td style="display: none;"></td>';
                        }

                        var formattedBuyout = item.buyout > 0 ? '$' + item.buyout.toLocaleString('ru-RU') : 'Без права';

                        tr.innerHTML = '<td>' + item.steam_id + '</td>' +
                            '<td>' + item.reason + '</td>' +
                            '<td>' + formattedBuyout + '</td>' +
                            actionButtons;
                        tbody.appendChild(tr);
                    });
                })
                .catch(function(err) { console.error("Ошибка загрузки:", err); });
        }

        function addPlayer() {
            var steam_id = document.getElementById('addSteam').value.trim();
            var reason = document.getElementById('addReason').value.trim();
            var buyout = document.getElementById('addBuyout').value.trim();

            if (!steam_id || !reason) {
                alert('Заполните Steam ID и причину!');
                return;
            }

            fetch('/api/add', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ steam_id: steam_id, reason: reason, buyout: buyout })
            }).then(function() {
                document.getElementById('addSteam').value = '';
                document.getElementById('addReason').value = '';
                document.getElementById('addBuyout').value = '';
                loadBlacklist();
            });
        }

        function makeBuyout(index) {
            fetch('/api/buyout', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ index: index })
            }).then(function() { loadBlacklist(); });
        }

        function removePlayer(index) {
            if (confirm('Точно удалить игрока из ЧС?')) {
                fetch('/api/remove', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ index: index })
                }).then(function() { loadBlacklist(); });
            }
        }

        function filterTable() {
            var input = document.getElementById('searchInput').value.toLowerCase();
            var rows = document.getElementById('tableBody').getElementsByTagName('tr');

            for (var i = 0; i < rows.length; i++) {
                var text = rows[i].textContent.toLowerCase();
                if (text.indexOf(input) > -1) {
                    rows[i].style.display = '';
                } else {
                    rows[i].style.display = 'none';
                }
            }
        }

        // Загружаем список при открытии страницы
        loadBlacklist();
    </script>
</body>
</html>
