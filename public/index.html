<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чёрный список | Клан МАКАН</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h1 { color: #ff4444; margin: 0; }
        
        input, button { padding: 10px; margin: 5px 0; border-radius: 5px; border: none; font-size: 14px; }
        input { width: 100%; background: #222; color: #fff; box-sizing: border-box; }
        
        .auth-box { background: #1a1a1a; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #333; display: flex; gap: 10px; }
        .btn-auth { background: #333; color: #ff4444; border: 1px solid #ff4444; cursor: pointer; font-weight: bold; white-space: nowrap; }
        .btn-auth:hover { background: #ff4444; color: #fff; }

        .admin-panel { display: none; background: #1a1a1a; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #ff4444; }
        .admin-panel h3 { margin-top: 0; color: #ff4444; }
        .form-row { display: flex; gap: 10px; }
        .btn-add { background: #ff4444; color: #fff; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: #1a1a1a; }
        th, td { padding: 12px; border: 1px solid #333; text-align: left; }
        th { background: #222; }
        
        .action-cell { display: none; }
        .btn-remove { background: #ff4444; color: #fff; cursor: pointer; }
        .btn-buyout { background: #4CAF50; color: #fff; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Чёрный список — Клан МАКАН</h1>
        </div>

        <!-- Поле авторизации -->
        <div class="auth-box" id="authForm">
            <input type="password" id="adminPasswordInput" placeholder="Введите пароль администратора...">
            <button type="button" id="loginBtn" class="btn-auth">Войти в админку</button>
        </div>

        <!-- Панель Администратора -->
        <div class="admin-panel" id="adminPanel">
            <h3>⚙️ Админ-панель: Добавить в ЧС</h3>
            <div class="form-row">
                <input type="text" id="addSteamId" placeholder="Steam2 ID (STEAM_0:1:...)" style="flex: 2;">
                <input type="number" id="addBuyout" placeholder="Откуп ($)" style="flex: 1;">
            </div>
            <input type="text" id="addReason" placeholder="Причина внесения">
            <button type="button" class="btn-add" id="addBtn">Добавить игрока</button>
            <button type="button" class="btn-auth" id="logoutBtn" style="width:100%; margin-top: 10px;">Выйти из админки</button>
        </div>

        <input type="text" id="search" placeholder="Поиск по Steam2 ID или причине...">
        
        <table id="blacklistTable">
            <thead>
                <tr>
                    <th>Steam2 ID</th>
                    <th>Причина</th>
                    <th>Откуп</th>
                    <th class="action-cell">Действия</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <script>
        var ADMIN_PASSWORD = "MAKAN-7Qp!29x";
        var isAdmin = false;

        // Безопасная привязка событий через JS (работает внутри Discord намертво)
        document.getElementById('loginBtn').addEventListener('click', function() {
            var pass = document.getElementById('adminPasswordInput').value;
            
            if (pass === ADMIN_PASSWORD) {
                isAdmin = true;
                document.getElementById('authForm').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
                loadBlacklist();
            } else {
                alert('Неверный пароль!');
            }
        });

        document.getElementById('adminPasswordInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('loginBtn').click();
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', function() {
            isAdmin = false;
            document.getElementById('adminPasswordInput').value = '';
            document.getElementById('adminPanel').style.display = 'none';
            document.getElementById('authForm').style.display = 'flex';
            loadBlacklist();
        });

        document.getElementById('addBtn').addEventListener('click', function() {
            var steam_id = document.getElementById('addSteamId').value.trim();
            var reason = document.getElementById('addReason').value.trim();
            var buyout = parseInt(document.getElementById('addBuyout').value) || 0;

            if (!steam_id || !reason) {
                alert('Заполните Steam2 ID и причину!');
                return;
            }

            fetch('/api/add', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ steam_id: steam_id, reason: reason, buyout: buyout })
            }).then(function() {
                document.getElementById('addSteamId').value = '';
                document.getElementById('addReason').value = '';
                document.getElementById('addBuyout').value = '';
                loadBlacklist();
            });
        });

        document.getElementById('search').addEventListener('keyup', function() {
            var input = this.value.toLowerCase();
            var rows = document.getElementById('tableBody').getElementsByTagName('tr');
            for (var i = 0; i < rows.length; i++) {
                var text = rows[i].textContent.toLowerCase();
                rows[i].style.display = text.indexOf(input) > -1 ? '' : 'none';
            }
        });

        function loadBlacklist() {
            fetch('/api/blacklist')
                .then(function(res) { return res.json(); })
                .then(function(data) {
                    var tbody = document.getElementById('tableBody');
                    tbody.innerHTML = '';

                    var actionCells = document.querySelectorAll('.action-cell');
                    for (var i = 0; i < actionCells.length; i++) {
                        actionCells[i].style.display = isAdmin ? 'table-cell' : 'none';
                    }

                    data.forEach(function(item, index) {
                        var tr = document.createElement('tr');
                        var actionButtons = '';
                        if (isAdmin) {
                            actionButtons = '<td class="action-cell" style="display: table-cell;">' +
                                '<button class="btn-buyout" onclick="markPaid(' + index + ')">Выкуплен</button> ' +
                                '<button class="btn-remove" onclick="removeItem(' + index + ')">Удалить</button>' +
                                '</td>';
                        }

                        tr.innerHTML = '<td><code>' + item.steam_id + '</code></td>' +
                            '<td>' + item.reason + '</td>' +
                            '<td>' + (item.buyout > 0 ? '$' + item.buyout : 'Без права') + '</td>' +
                            actionButtons;
                        tbody.appendChild(tr);
                    });
                })
                .catch(function(err) { console.error("Ошибка:", err); });
        }

        function markPaid(index) {
            fetch('/api/buyout', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ index: index })
            }).then(function() { loadBlacklist(); });
        }

        function removeItem(index) {
            fetch('/api/remove', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ index: index })
            }).then(function() { loadBlacklist(); });
        }

        loadBlacklist();
    </script>
</body>
</html>
